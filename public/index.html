<!-- login page -->
<head>
    <link rel="stylesheet" href="style.css">
    <style>
    .background-image {
    position: fixed;
    left: 0;
    right: 0;
    z-index: -1;
    display: block;
    background-image: url('Assets/Images/loginbg.jpg');
    background-size: cover;
    width: 100%;
    height: 115%;
    filter: blur(5px);
    margin-top: -18px;
    }

    .content {
    position: fixed;
    left: 0;
    right: 0;
    z-index: 1;
    }
    </style>
</head>
<body>
    <div class="background-image"></div>
    <div class="content">
    <div class="loginpage">
        <center><img class="loginlogo"src="Assets/Images/placeholder.png" width="150vw">
        <div class="loginboxes">
            <textarea placeholder="Username" id="username" class="loginbox"></textarea><br><br>
            <textarea placeholder="Password" id="password" class="loginbox"></textarea><br><br>
        </div>
    <button onclick="login()" class="loginbutton">LOGIN</button>

    </div>
    </div>
</body>

<script src="script.js"></script>
