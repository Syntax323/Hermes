
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="login.css">

    <title>Edit Profile</title>
</head>

<body>
    <div class="background-image"></div>

    <div class="content">
        <div class="loginpage">
            <center>
                <h2>Edit Profile</h2>

                <div class="loginboxes">
                    <p>Theme</p>

                    <select id="theme" class="loginbox">
                        <option value="theme0">Standard</option>
                        <option value="theme1">Frutiger Aero</option>
                        <option value="theme2">Mountains</option>
                    </select>

                    <br>

                    <p>Profile Picture</p>

                    <select id="pfp" class="loginbox">
                        <option value="pfp0">Default</option>
                        <option value="pfp1">1</option>
                        <option value="pfp2">2</option>
                        <option value="pfp3">3</option>
                        <option value="pfp4">4</option>
                        <option value="pfp5">5</option>
                        <option value="pfp6">6</option>
                        <option value="pfp7">7</option>
                        <option value="pfp8">8</option>
                        <option value="pfp9">9</option>
                        <option value="pfp10">10</option>
                        <option value="pfp11">11</option>
                        <option value="pfp12">12</option>
                        <option value="pfp13">13</option>
                        <option value="pfp14">14</option>
                        <option value="pfp15">15</option>
                        <option value="pfp16">16</option>
                        <option value="pfp17">17</option>
                        <option value="pfp18">18</option>
                        <option value="pfp19">19</option>
                        <option value="pfp20">20</option>
                        <option value="pfp21">21</option>
                        <option value="pfp22">22</option>
                        <option value="pfp23">23</option>
                    </select>

                    <br>

                    <p>Name Color</p>

                    <input
                        type="color"
                        id="namecolor"
                        value="#ffffff"
                    >

                    <br>

                    <a href="pfps.html">
                        <p>Click here to see profile picture options</p>
                    </a>
                </div>

                <p id="profile-status"></p>

                <button
                    onclick="save()"
                    class="loginbutton"
                    type="button"
                >
                    Save
                </button>
            </center>
        </div>
    </div>

    <script src="customize.js"></script>
</body>
</html>
